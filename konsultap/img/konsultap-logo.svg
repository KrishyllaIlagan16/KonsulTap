<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="KonsulTap logo">
  <defs>
    <linearGradient id="ktBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6b3f"/>
      <stop offset="100%" stop-color="#063a24"/>
    </linearGradient>
  </defs>
  <!-- Rounded clinical badge -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#ktBg)"/>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="none" stroke="#f2d900" stroke-width="4"/>
  <!-- Tap ripple ring -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="#f2d900" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="10 7"/>
  <!-- Crisp medical cross -->
  <rect x="51" y="30" width="18" height="60" rx="5" fill="#ffffff"/>
  <rect x="30" y="51" width="60" height="18" rx="5" fill="#ffffff"/>
  <!-- Gold center pulse dot ("Tap") -->
  <circle cx="60" cy="60" r="7.5" fill="#f2d900"/>
</svg>
